name: Feature request
description: Suggest an idea
labels: ["feat", "pending"]
title: "[FR]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting this request, search existing issues and describe the
        user-facing problem. This repository owns both Krypton's shared changes
        and its Windows build integration.
  - type: input
    id: description
    attributes:
      label: Description
      description: A clear and concise description (in one line) of what your suggestion is
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Who's implementing?
      options:
        - label: I'm willing to implement this feature myself
  - type: textarea
    id: prob
    attributes:
      label: The problem
      description: Please describe the problem you are solving or new feature you're suggesting
      placeholder: I'm always frustrated when [...] happens
    validations:
      required: true
  - type: textarea
    id: sol
    attributes:
      label: Possible solutions
      description: Please describe possible solution(-s) to your problem
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the feature request here
